<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Classificação completa da prova: posição, tempo, pace, categoria e equipe de cada atleta.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#F3F5FA; --surface:#FFFFFF; --surface-2:#EEF2F8; --line:#D5DCE8; --line-soft:#E4E9F2;
  --ink:#0E1726; --ink-2:#2E3A50; --muted:#5B6880; --accent:#EF4E16; --accent-wash:#FFE6DA;
  --azul:#1250C4; --azul-ink:#0D3F9E; --azul-wash:#E1EAFD; --sol:#FFC21A; --sol-wash:#FFF4D1;
  --shadow:0 1px 2px rgba(14,23,38,.06), 0 12px 26px -16px rgba(14,23,38,.38);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif; --f-mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0A0F1C; --surface:#131B2D; --surface-2:#0F1628; --line:#26324C; --line-soft:#1B2539;
  --ink:#EAF0FA; --ink-2:#C0CBE0; --muted:#8C99B3; --accent:#FF7143; --accent-wash:#3B1A0E;
  --azul:#6B97FF; --azul-ink:#A9C2FF; --azul-wash:#15234A; --sol:#FFC940; --sol-wash:#3A2F0A;
  --shadow:0 1px 0 rgba(0,0,0,.35), 0 14px 30px -18px #000 } }
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font:16px/1.5 var(--f-body); -webkit-font-smoothing:antialiased}
a{color:inherit}
[hidden]{display:none !important}
.wrap{width:min(1120px,100% - 2rem); margin-inline:auto}
header.top{position:relative; overflow:hidden; color:#fff;
  background:radial-gradient(90% 130% at 100% 0%, rgba(255,194,26,.26), transparent 58%), linear-gradient(135deg,#0A2F73 0%,#1450C8 100%)}
header.top::after{content:""; position:absolute; left:0; right:0; bottom:0; height:6px; background:repeating-linear-gradient(90deg,#FFC21A 0 20px,#EF4E16 20px 40px)}
.top__inner{padding:1.8rem 0 2rem}
.migalha{display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; font-family:var(--f-mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.75); margin:0}
.migalha a{color:#FFC21A; text-decoration:none}
.migalha a:hover{text-decoration:underline}
h1{font-family:var(--f-display); font-weight:800; font-size:clamp(1.7rem,4.6vw,2.7rem); margin:.4rem 0 .25rem; letter-spacing:-.025em; line-height:1.05; max-width:28ch}
.sub{margin:0; opacity:.9; font-size:.98rem}
.nums{display:flex; gap:.6rem; flex-wrap:wrap; margin-top:1.1rem}
.nums div{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:.55rem .85rem; min-width:6.5rem}
.nums b{display:block; font-family:var(--f-display); font-weight:800; font-size:1.4rem; color:#fff; line-height:1.1; font-variant-numeric:tabular-nums}
.nums div:first-child b{color:#FFC21A}
.nums span{font-family:var(--f-mono); font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; opacity:.8}
main{padding:1.4rem 0 3rem}
td.atleta a{font-weight:600; text-decoration:none; color:var(--ink)}
td.atleta a:hover{color:var(--azul-ink); text-decoration:underline}
td.atleta small{display:block; color:var(--muted); font-size:.76rem}
td.pos small{display:block; font-family:var(--f-mono); font-size:.6rem; color:var(--muted); margin-top:.15rem; text-align:center}
td.tempo{font-family:var(--f-display); font-weight:800; font-size:.98rem}
td.pace{font-family:var(--f-mono); font-size:.82rem; color:var(--ink-2)}
td.cat{font-size:.82rem; color:var(--ink-2)}
tr.voce td{background:var(--sol-wash) !important}
.voce-tag{display:inline-block; margin-left:.35rem; font-family:var(--f-mono); font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; background:var(--sol); color:#0A2F73; border-radius:5px; padding:.05rem .35rem}
.vazia{padding:1.4rem; color:var(--ink-2); text-align:center}
.aviso{padding:1.4rem}
.aviso a{color:var(--azul-ink); font-weight:600}
.nota{font-size:.8rem; color:var(--muted); margin:.9rem 0 0}
.nota a{color:var(--azul-ink)}
.carregando{color:var(--muted); padding:1.5rem 0}
.cat-cel{display:none}
@media (max-width:640px){
  .opc{display:none} .cat-cel{display:inline}
  .pg-tabela td,.pg-tabela th{padding:.5rem .4rem} .pg-tabela table{font-size:.84rem}
  .nums div{min-width:0; flex:1 1 40%}
}
</style>
</head>
<body>
<nav class="sitenav" aria-label="Seções do site"><div class="sitenav__in">
  <a class="sitenav__marca" href="./"><img src="favicon.svg" alt=""><span>Cupons de Corrida</span></a>
  <div class="sitenav__links">
    <a href="./">Calendário</a><a href="./#resultados" aria-current="page">Resultados</a><a href="ranking.html">Ranking</a><a href="atletas.html">Atletas</a><a href="atletas.html#supertrunfo">Supertrunfo</a><a href="cupons.html">Cupons</a>
  </div>
  <a class="entrar-topo" href="area.html" data-entrar>Entrar</a>
</div></nav>
<header class="top">
  <div class="wrap top__inner">
    <p class="migalha"><a href="./#resultados">Resultados</a><span>›</span><span>Classificação completa</span></p>
    <h1 id="titulo">Resultado</h1>
    <p class="sub" id="sub"></p>
    <div class="nums" id="nums"></div>
  </div>
</header>
<main><div class="wrap" id="conteudo"><p class="carregando">Carregando a classificação…</p></div></main>

<script>
(() => {
// Resultados por atleta: servidos pela Cloudflare (dados.cuponsdecorrida.com.br).
// Se falhar, a copia antiga do site serve de reserva. Em localhost, os locais.
const DADOS_URL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "" : "https://dados.cuponsdecorrida.com.br/";
async function buscarDados(caminho, opcoes){
  if (DADOS_URL){
    try { const r = await fetch(DADOS_URL + caminho, opcoes); if (r.ok) return r; } catch (e) { /* tenta a reserva */ }
  }
  return fetch((/^bi\./.test(location.hostname) ? "https://www.cuponsdecorrida.com.br/" : "") + caminho, opcoes);
}
  const params = new URLSearchParams(location.search);
  const slug = (params.get("p") || "").trim();
  const conteudo = document.getElementById("conteudo");
  const num = n => n.toLocaleString("pt-BR");
  const el = (tag, props = {}, kids = []) => {
    const n = Object.assign(document.createElement(tag), props);
    kids.forEach(k => k != null && n.append(k));
    return n;
  };
  const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const PEQUENAS = new Set(["da", "de", "do", "das", "dos", "e"]);
  const titulo = s => String(s || "").toLowerCase().split(/\s+/)
    .map((p, i) => i && PEQUENAS.has(p) ? p : p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
  const tempo = s => { if (!s) return "—"; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ":" : "") + String(m).padStart(h ? 2 : 1, "0") + ":" + String(x).padStart(2, "0"); };
  const pace = s => s ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + "/km" : "—";
  const dataBr = s => s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "";
  // Mesmo nome de arquivo que o coletor grava (atletas_coleta.arquivo_de).
  const arquivo = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const kmDe = m => { const x = String(m).match(/(\d+(?:[.,]\d+)?)\s*k/i); return x ? Number(x[1].replace(",", ".")) : 999; };
  const openResults = "https://openresults.run/evento/" + encodeURIComponent(slug) + "/";

  function semDados(msg) {
    document.getElementById("titulo").textContent = "Resultado";
    conteudo.replaceChildren(el("div", { className: "pg-card aviso" }, [
      el("p", { textContent: msg }),
      slug ? el("p", {}, [el("a", { href: openResults, target: "_blank", rel: "noopener", textContent: "Ver a classificação no Open Results ↗" })]) : null,
      el("p", {}, [el("a", { href: "./", textContent: "← voltar ao calendário" })]),
    ]));
  }

  async function carregar() {
    // Endereco do Open Results: pode ter acento; so nao pode ter barra.
    if (slug.length < 3 || slug.length > 250 || /[\/\?#]/.test(slug)) return semDados("Prova não informada.");
    let d;
    try {
      const r = await buscarDados("atletas/provas/" + arquivo(slug) + ".json");
      if (!r.ok) throw new Error("sem arquivo");
      d = await r.json();
    } catch (e) {
      return semDados("A classificação completa desta prova ainda não está no Cupons de Corrida (temos os resultados por atleta das provas de 2022 em diante).");
    }
    if (d.erro || !(d.linhas || []).length) return semDados("A classificação desta prova não pôde ser lida.");
    montar(d);
  }

  function montar(d) {
    document.title = d.nome + " · Resultado · Cupons de Corrida";
    document.getElementById("titulo").textContent = d.nome;
    document.getElementById("sub").textContent = dataBr(d.data) + " · " + d.cidade;

    // Uma linha por atleta e modalidade; posicao calculada aqui pelo tempo,
    // na modalidade (geral) e no sexo.
    const vistos = new Set();
    const linhas = [];
    d.linhas.forEach(([sl, nome, sexo, mod, cat, equipe, pos, t, p]) => {
      const k = sl + "|" + mod;
      if (vistos.has(k)) return;
      vistos.add(k);
      linhas.push({ slug: sl, nome: titulo(nome), sexo, mod, cat: cat || "", equipe: equipe || "", t, p, busca: norm(nome + " " + (equipe || "")) });
    });
    const mods = [...new Set(linhas.map(l => l.mod))].sort((a, b) => kmDe(a) - kmDe(b) || a.localeCompare(b));
    mods.forEach(m => {
      const da = linhas.filter(l => l.mod === m).sort((a, b) => (a.t || 9e9) - (b.t || 9e9));
      const porSexo = {};
      da.forEach((l, i) => {
        l.geral = l.t ? i + 1 : null;
        porSexo[l.sexo] = (porSexo[l.sexo] || 0) + (l.t ? 1 : 0);
        l.noSexo = l.t ? porSexo[l.sexo] : null;
      });
    });

    const fem = linhas.filter(l => l.sexo === "F").length, masc = linhas.filter(l => l.sexo === "M").length;
    document.getElementById("nums").replaceChildren(...[
      [num(linhas.length), "concluintes"], [mods.length, mods.length === 1 ? "distância" : "distâncias"],
      [num(fem), "mulheres"], [num(masc), "homens"],
    ].map(([v, r]) => el("div", {}, [el("b", { textContent: String(v) }), el("span", { textContent: r })])));

    const estado = { mod: mods[0], sexo: "", cat: "", q: "", mostrar: 100 };
    const segMod = el("div", { className: "pg-seg", role: "group", ariaLabel: "Distância" });
    const grupoMod = el("div", { className: "pg-barra__grupo" }, [el("span", { className: "pg-barra__rotulo", textContent: "Distância" }), segMod]);
    mods.forEach(m => {
      const b = el("button", { type: "button" }, [document.createTextNode(m), el("small", { textContent: num(linhas.filter(l => l.mod === m).length) })]);
      b.dataset.mod = m;
      b.setAttribute("aria-pressed", String(m === estado.mod));
      b.onclick = () => { estado.mod = m; estado.cat = ""; estado.mostrar = 100;
        segMod.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); pintarCategorias(); pintar(); };
      segMod.append(b);
    });
    const segSexo = el("div", { className: "pg-seg", role: "group", ariaLabel: "Sexo" });
    const grupoSexo = el("div", { className: "pg-barra__grupo" }, [el("span", { className: "pg-barra__rotulo", textContent: "Sexo" }), segSexo]);
    [["", "Geral"], ["F", "Feminino"], ["M", "Masculino"]].forEach(([v, rot]) => {
      const b = el("button", { type: "button", textContent: rot });
      b.setAttribute("aria-pressed", String(v === estado.sexo));
      b.onclick = () => { estado.sexo = v; estado.mostrar = 100;
        segSexo.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); pintar(); };
      segSexo.append(b);
    });
    const busca = el("input", { type: "search", placeholder: "Buscar atleta ou equipe…", autocomplete: "off", ariaLabel: "Buscar atleta ou equipe" });
    busca.oninput = () => { estado.q = norm(busca.value.trim()); estado.mostrar = 100; pintar(); };
    const categorias = el("select", { className: "pg-select", ariaLabel: "Categoria" });
    categorias.onchange = () => { estado.cat = categorias.value; estado.mostrar = 100; pintar(); };
    function pintarCategorias() {
      const cats = [...new Set(linhas.filter(l => l.mod === estado.mod).map(l => l.cat).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR", { numeric: true }));
      categorias.replaceChildren(el("option", { value: "", textContent: "Todas as categorias" }), ...cats.map(c => el("option", { value: c, textContent: c })));
      categorias.hidden = !cats.length;
    }
    pintarCategorias();

    const corpo = el("tbody");
    const tabela = el("table", {}, [el("thead", {}, [el("tr", {}, [
      el("th", { textContent: "Pos." }), el("th", { textContent: "Atleta" }), el("th", { className: "opc", textContent: "Categoria" }),
      el("th", { className: "n", textContent: "Tempo" }), el("th", { className: "n opc", textContent: "Pace" }),
    ])]), corpo]);
    const rodape = el("div");
    const podio = el("div", { className: "pg-podio" });
    const tituloTabela = el("h2");
    conteudo.replaceChildren(
      el("div", { className: "pg-card pg-barra" }, [grupoMod, grupoSexo]),
      el("div", { className: "pg-card pg-barra" }, [el("label", { className: "pg-busca" }, [busca]), categorias]),
      el("div", { className: "pg-secao" }, [el("div", {}, [el("span", { className: "pg-olho", textContent: "Classificação" }), tituloTabela])]),
      podio,
      el("div", { className: "pg-tabela" }, [tabela]), rodape,
      el("p", { className: "nota" }, [document.createTextNode("Posição calculada pelo tempo publicado pela cronometragem, na distância e no sexo. Resultado oficial: "),
        el("a", { href: openResults, target: "_blank", rel: "noopener", textContent: "Open Results ↗" }), document.createTextNode(".")]),
    );

    let meuSlug = "";
    function pintar() {
      const lista = linhas.filter(l => l.mod === estado.mod && (!estado.sexo || l.sexo === estado.sexo)
        && (!estado.cat || l.cat === estado.cat) && (!estado.q || l.busca.includes(estado.q)))
        .sort((a, b) => (a.t || 9e9) - (b.t || 9e9));
      tituloTabela.textContent = estado.mod + " · " + (estado.sexo === "F" ? "Feminino" : estado.sexo === "M" ? "Masculino" : "Geral") + (estado.cat ? " · " + estado.cat : "");
      // podio: os tres primeiros do recorte (some quando ha busca por nome)
      const tres = estado.q ? [] : lista.filter(l => l.t).slice(0, 3);
      podio.hidden = tres.length < 3;
      const degrau = (l, n) => { const d = el("div", { className: "pg-podio__item p" + n }, [
        el("a", { className: "pg-podio__nome", href: "atletas.html#" + l.slug, textContent: l.nome }),
        el("span", { className: "pg-podio__valor", textContent: tempo(l.t) }),
        el("span", { className: "pg-podio__det", textContent: [pace(l.p), l.equipe || l.cat].filter(Boolean).join(" · ") })]);
        d.dataset.pos = n + "º"; return d; };
      if (tres.length === 3) podio.replaceChildren(degrau(tres[1], 2), degrau(tres[0], 1), degrau(tres[2], 3));
      corpo.replaceChildren(...lista.slice(0, estado.mostrar).map(l => {
        const pos = estado.sexo ? l.noSexo : l.geral;
        const naPosicao = estado.cat ? lista.indexOf(l) + 1 : pos;
        return el("tr", { className: l.slug === meuSlug ? "voce" : "" }, [
          el("td", { className: "pos" }, [el("span", { className: "pg-pos" + (naPosicao && naPosicao <= 3 && !estado.q ? " p" + naPosicao : ""), textContent: pos ? pos + "º" : "—" }),
            !estado.sexo && l.noSexo ? el("small", { textContent: l.noSexo + "º " + (l.sexo === "F" ? "fem" : "masc") }) : null]),
          el("td", { className: "atleta" }, [
            el("a", { href: "atletas.html#" + l.slug, textContent: l.nome }),
            l.slug === meuSlug ? el("span", { className: "voce-tag", textContent: "você" }) : null,
            el("small", {}, [document.createTextNode(l.equipe),
              l.cat ? el("span", { className: "cat-cel", textContent: (l.equipe ? " · " : "") + l.cat }) : null])]),
          el("td", { className: "opc cat", textContent: l.cat || "—" }),
          el("td", { className: "n tempo", textContent: tempo(l.t) }),
          el("td", { className: "n pace opc", textContent: pace(l.p) }),
        ]);
      }));
      rodape.replaceChildren();
      if (!lista.length) rodape.append(el("p", { className: "vazia", textContent: "Nenhum atleta encontrado com esses filtros." }));
      if (lista.length > estado.mostrar) {
        const mais = el("button", { className: "pg-mais", type: "button", textContent: "Mostrar mais (" + num(lista.length - estado.mostrar) + " restantes)" });
        mais.onclick = () => { estado.mostrar += 200; pintar(); };
        rodape.append(mais);
      }
    }
    pintar();

    // Atleta logado com o perfil ligado: destaca a propria linha e vai para a distancia dele.
    if (window.cuponsSessao) window.cuponsSessao.then(a => {
      if (!a || !a.slug_atleta) return;
      meuSlug = a.slug_atleta;
      const minha = linhas.find(l => l.slug === meuSlug);
      if (minha && minha.mod !== estado.mod) {
        const b = [...segMod.querySelectorAll("button")].find(x => x.dataset.mod === minha.mod);
        if (b) return b.click();
      }
      pintar();
    });
  }

  carregar();
})();
</script>
<script src="cadastro.js"></script>
</body>
</html>
